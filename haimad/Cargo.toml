[package]
name = "haimad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Haima daemon — agentic finance engine for the Agent OS"

[lib]
name = "haimad"
path = "src/lib.rs"

[[bin]]
name = "haimad"
path = "src/main.rs"

[dependencies]
haima-core.workspace = true
haima-wallet.workspace = true
# `custody-adapter` pulls `anima-identity` so the x402 substrate RPC can
# sign EIP-3009 authorizations from the user's Anima-custodied wallet
# (CustodyWalletAdapter). BRO-1354 (x402 transport, slice 2).
haima-x402 = { workspace = true, features = ["custody-adapter"] }
anima-identity = { path = "../../anima/anima-identity", version = "0.3.0" }
haima-lago.workspace = true
haima-api.workspace = true
haima-outcome.workspace = true
haima-substrate-proto.workspace = true
aios-protocol.workspace = true
aios-proto.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
prost = "0.14"
prost-types = "0.14"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tonic = "0.14"
tracing.workspace = true
tracing-subscriber.workspace = true
life-vigil.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
ulid.workspace = true
life-paths.workspace = true

[dev-dependencies]
haima-proxy = { workspace = true }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream.workspace = true
wiremock = "0.6"

[lints]
workspace = true
